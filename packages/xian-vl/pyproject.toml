[project]
name = "xian-vl"
version = "2.0.0"
description = "Core AI translation engine — prompt engineering, context management, and Lemonade orchestration"
requires-python = ">=3.10, <3.14"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "Pillow>=12.3.0",
    "openai>=1.0.0",
    "numpy>=1.24",
    "imagehash>=4.3",
    "httpx>=0.27",
    "shared-types",
    "pyyaml",
]

[project.optional-dependencies]
# 1.28.1 fixes GHSA-vj7q-gjh5-988w (WebSocket Host/Origin validation). Capped
# below 2.0, which removed mcp.server.fastmcp — the API knowledge/mcp_server.py
# is built on.
mcp = ["mcp>=1.28.1,<2.0"]
dev = ["pytest>=8.0"]
# Local text detection/recognition for live translation. Optional because the
# vision model can do the same job unaided, just an order of magnitude slower.
ocr = ["onnxruntime>=1.17", "rapidocr-onnxruntime>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xian"]

[tool.uv.sources]
shared-types = { workspace = true }
